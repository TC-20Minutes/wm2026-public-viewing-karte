<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
  <title>Public Viewing in der Schweiz – WM 2026 | 20 Minuten</title>
  <meta name="description" content="Alle Public-Viewing-Standorte zur Fussball-WM 2026 in der Schweiz auf einer interaktiven Karte." />

  <!-- Vendored libraries (no runtime CDN dependency) -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css" />
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="vendor/gesture-handling/leaflet-gesture-handling.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" data-view="map">
    <header class="toolbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">20</span>
        <span class="titles">
          <h1>Public Viewing in der Schweiz</h1>
          <p>Fussball-WM 2026</p>
        </span>
      </div>

      <div class="controls">
        <div class="field select">
          <select id="canton-filter" aria-label="Nach Kanton filtern">
            <option value="">Alle Kantone</option>
          </select>
        </div>

        <div class="view-toggle" role="group" aria-label="Ansicht wechseln">
          <button id="view-map" type="button" aria-pressed="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 4 6 2 5-2v14l-5 2-6-2-5 2V6l5-2Zm0 0v14m6-12v14" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            Karte
          </button>
          <button id="view-list" type="button" aria-pressed="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Liste
          </button>
        </div>
      </div>

      <p class="result-count" id="result-count" aria-live="polite"></p>
    </header>

    <main>
      <div id="map" role="application" aria-label="Karte der Public-Viewing-Standorte"></div>
      <div id="list" class="list-view" aria-label="Liste der Public-Viewing-Standorte"></div>
    </main>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <span class="handle" aria-hidden="true"></span>
    <button class="close" id="sheet-close" type="button" aria-label="Schliessen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <div class="scroll">
      <img class="teaser" id="sheet-img" alt="" />
      <div class="content">
        <h2 id="sheet-title"></h2>
        <span class="chip" id="sheet-canton"></span>
        <p class="row" id="sheet-address-row">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="1.8"/></svg>
          <span id="sheet-address"></span>
        </p>
        <p class="desc" id="sheet-desc"></p>
        <a class="cta" id="sheet-link" href="#" target="_blank" rel="noopener noreferrer">
          Zur Website
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 17 17 7M17 7H9m8 0v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </div>
  </aside>

  <!-- Vendored scripts -->
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/markercluster/leaflet.markercluster.js"></script>
  <script src="vendor/gesture-handling/leaflet-gesture-handling.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
